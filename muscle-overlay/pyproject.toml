[project]
name = "muscle-overlay"
version = "0.1.0"
description = "Superimpose anatomical muscle-activation highlights onto exercise videos and photos"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10",
    "pillow>=10.0",
    "numpy>=1.26",
    "opencv-python>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
